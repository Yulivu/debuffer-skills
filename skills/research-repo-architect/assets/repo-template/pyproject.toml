[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{project_slug}}"
version = "0.1.0"
description = "{{project_title}} research code and reproducible experiments."
readme = {text = "{{project_title}} research code and reproducible experiments.", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]
experiments = [
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]
